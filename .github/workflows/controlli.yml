# I controlli del sito (sorgenti/controlla.py). Non pubblica e non cambia niente.
# - Su ogni proposta (pull request): gli stessi controlli che la pubblicazione fa prima di mettere online,
#   così un errore si vede prima del sì di Elias.
# - Ogni mattina: il sito di prova e larosadoro.org rispondono, i loro certificati non stanno per scadere,
#   lo script del foglio «Contatti della Fondazione» (moduli, notizie, giardino) risponde.
# - Il lunedì, dopo ogni pubblicazione e a mano: anche i collegamenti verso altri siti.
# - Se la pubblicazione si ferma (un controllo prima di pubblicare non è passato, oppure né il foglio né il sito
#   rispondono) o se qui un controllo fallisce, apre una segnalazione (issue) assegnata a Elias, con il resoconto.
#   Una sola alla volta: finché è aperta, i problemi successivi non ne aprono altre.
# La correzione si propone come sempre e va online solo dopo il sì di Elias.
name: Controlla il sito

on:
  pull_request:
  schedule:
    - cron: '41 4 * * *'
  workflow_run:
    workflows: ["Pubblica il sito"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proposta:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Scarica la proposta
        uses: actions/checkout@v4
      - name: Controlla la proposta come prima di pubblicarla
        run: python3 sorgenti/controlla.py

  controlla:
    # dei giri di ogni ora della pubblicazione (le dediche) basta sapere se si sono fermati
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'failure' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4
      - name: Pubblicazione fermata
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
        run: |
          echo "La pubblicazione del sito si è fermata: online resta la versione di prima." | tee esito.txt
          exit 1
      - name: Controlla il sito pubblicato
        if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
        run: |
          set -o pipefail
          collegamenti=""
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || [ "$(date -u +%u)" = 1 ]; then collegamenti="--collegamenti"; fi
          python3 sorgenti/controlla.py --in-rete $collegamenti | tee esito.txt
      - name: Apre una segnalazione per Elias
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESOCONTO: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
          PUBBLICAZIONE: ${{ github.event.workflow_run.html_url }}
        run: |
          titolo="Il sito ha bisogno di un controllo"
          aperta=$(gh issue list --state open --json number,title --jq ".[] | select(.title == \"$titolo\") | .number")
          if [ -n "$aperta" ]; then echo "La segnalazione #$aperta è già aperta"; exit 0; fi
          {
            echo "Un controllo automatico del sito non è passato. Online resta l’ultima versione pubblicata."
            echo
            echo '```'
            tail -n 60 esito.txt 2>/dev/null || echo "(nessun resoconto)"
            echo '```'
            echo
            echo "Il resoconto di questo controllo: $RESOCONTO"
            if [ -n "$PUBBLICAZIONE" ]; then echo "La pubblicazione da cui è partito: $PUBBLICAZIONE"; fi
          } > corpo.md
          gh issue create --title "$titolo" --body-file corpo.md --assignee eliasminotti
