# I controlli del sito (sorgenti/controlla.py). Non pubblica e non cambia niente.
# - Su ogni proposta (pull request): gli stessi controlli che la pubblicazione fa prima di mettere online,
#   così un errore si vede prima del sì di Elias.
# - Ogni mattina: il sito di prova e larosadoro.org rispondono, i loro certificati non stanno per scadere,
#   lo script del foglio «Contatti della Fondazione» (moduli, notizie, giardino) risponde.
# - Il lunedì, dopo ogni pubblicazione e a mano: anche i collegamenti verso altri siti.
# - Se la pubblicazione si ferma (un controllo prima di pubblicare non è passato, oppure né il foglio né il sito
#   rispondono) o se qui un controllo fallisce, apre la segnalazione (issue) «Problema sul sito della Fondazione»,
#   con il resoconto, e sveglia subito la routine di Claude «Sito La Rosa d’Oro: giro del mattino sui controlli»
#   (ROUTINE qui sotto): Claude lo scrive a Elias nel progetto, e a lui arriva la notifica dell’app sul telefono.
#   Per svegliarla serve il segreto ROUTINE_TOKEN del repository (il token della routine, che si genera dalla
#   pagina della routine su claude.ai/code/routines, «API»); senza, Claude lo vede al giro del mattino.
#   Una segnalazione sola alla volta: finché è aperta, i problemi successivi non ne aprono altre né svegliano Claude.
# - A mano, con «Avviso di prova»: apre una segnalazione di prova, per vedere che l’avviso arrivi.
# La correzione si propone come sempre e va online solo dopo il sì di Elias.
name: Controlla il sito

on:
  pull_request:
  schedule:
    - cron: '41 4 * * *'
  workflow_run:
    workflows: ["Pubblica il sito"]
    types: [completed]
  workflow_dispatch:
    inputs:
      prova:
        description: Avviso di prova (apre una segnalazione e sveglia Claude)
        type: boolean
        default: false

permissions:
  contents: read

env:
  ROUTINE: https://api.anthropic.com/v1/claude_code/routines/trig_01GimrxxKbZ2YPuztqXUbzkj/fire

jobs:
  proposta:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Scarica la proposta
        uses: actions/checkout@v4
      - name: Controlla la proposta come prima di pubblicarla
        run: python3 sorgenti/controlla.py

  controlla:
    # dei giri di ogni ora della pubblicazione (le dediche) basta sapere se si sono fermati
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'failure' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4
      - name: Avviso di prova
        if: github.event_name == 'workflow_dispatch' && inputs.prova
        run: |
          echo "Prova dell’avviso, chiesta a mano: il sito non ha niente che non va." | tee esito.txt
          exit 1
      - name: Pubblicazione fermata
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
        run: |
          echo "La pubblicazione del sito si è fermata: online resta la versione di prima." | tee esito.txt
          exit 1
      - name: Controlla il sito pubblicato
        if: (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && !inputs.prova
        run: |
          set -o pipefail
          collegamenti=""
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || [ "$(date -u +%u)" = 1 ]; then collegamenti="--collegamenti"; fi
          python3 sorgenti/controlla.py --in-rete $collegamenti | tee esito.txt
      - name: Apre una segnalazione per Elias
        id: segnalazione
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESOCONTO: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
          PUBBLICAZIONE: ${{ github.event.workflow_run.html_url }}
        run: |
          titolo="Problema sul sito della Fondazione"
          aperta=$(gh issue list --state open --json number,title --jq ".[] | select(.title == \"$titolo\") | .number")
          if [ -n "$aperta" ]; then echo "La segnalazione #$aperta è già aperta"; exit 0; fi
          {
            echo "Un controllo automatico del sito non è passato. Online resta l’ultima versione pubblicata."
            echo
            echo '```'
            tail -n 60 esito.txt 2>/dev/null || echo "(nessun resoconto)"
            echo '```'
            echo
            echo "Il resoconto di questo controllo: $RESOCONTO"
            if [ -n "$PUBBLICAZIONE" ]; then echo "La pubblicazione da cui è partito: $PUBBLICAZIONE"; fi
          } > corpo.md
          indirizzo=$(gh issue create --title "$titolo" --body-file corpo.md --assignee eliasminotti)
          echo "Segnalazione aperta: $indirizzo"
          echo "indirizzo=$indirizzo" >> "$GITHUB_OUTPUT"
      - name: Sveglia Claude, che lo scrive a Elias nell’app
        if: failure() && steps.segnalazione.outputs.indirizzo
        env:
          TOKEN: ${{ secrets.ROUTINE_TOKEN }}
          SEGNALAZIONE: ${{ steps.segnalazione.outputs.indirizzo }}
        run: |
          if [ -z "$TOKEN" ]; then echo "Manca il segreto ROUTINE_TOKEN: Claude lo vedrà al giro del mattino"; exit 0; fi
          testo="Un controllo del sito non è passato: $SEGNALAZIONE"$'\n\n'"$(tail -n 40 esito.txt 2>/dev/null)"
          jq -n --arg t "$testo" '{text: $t}' > avviso.json
          curl --fail-with-body -sS -X POST "$ROUTINE" \
            -H "Authorization: Bearer $TOKEN" -H "anthropic-version: 2023-06-01" -H "Content-Type: application/json" \
            --data @avviso.json || echo "Claude non si è svegliato: lo vedrà al giro del mattino"
