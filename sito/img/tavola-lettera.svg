<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-label="Una lettera chiusa dal sigillo con la rosa, e una penna stilografica, incise su fondo avorio">
<defs>
  <pattern id="tr-rado" width="17" height="17" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
    <line x1="0" y1="0" x2="0" y2="17" stroke="currentColor" stroke-width=".9" opacity=".35"/>
  </pattern>
  <pattern id="tr-medio" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
    <line x1="0" y1="0" x2="0" y2="10" stroke="currentColor" stroke-width="1.1" opacity=".45"/>
  </pattern>
  <linearGradient id="luceL" x1="1" y1="0" x2=".2" y2="1">
    <stop offset="0%" stop-color="#B88F3D" stop-opacity=".14"/>
    <stop offset="55%" stop-color="#B88F3D" stop-opacity=".04"/>
    <stop offset="100%" stop-color="#FBFBF9" stop-opacity="0"/>
  </linearGradient>
  <symbol id="rosa" viewBox="0 0 200 200">
    <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round">
      <circle cx="100" cy="100" r="12"/>
      <path d="M100 70c17-11 36-3 38 16s-15 33-38 30"/><path d="M100 130c-17 11-36 3-38-16s15-33 38-30"/>
      <path d="M100 34c33-19 69-3 72 32s-29 62-72 57"/><path d="M100 166c-33 19-69 3-72-32s29-62 72-57"/>
    </g>
  </symbol>
</defs>
  <rect width="1400" height="760" fill="#FBFBF9"/>
  <path d="M700 40 1400 0 1400 760 300 760z" fill="url(#luceL)"/>

  <!-- il piano del tavolo -->
  <g color="#1C1C1C" fill="none" stroke="currentColor" stroke-linecap="round">
    <path d="M60 640h1280" stroke-width="1.2" opacity=".35"/>
    <path d="M120 690h1160M200 730h1000" stroke-width=".7" opacity=".14"/>
  </g>

  <!-- l'ombra della lettera -->
  <g color="#1C1C1C" opacity=".22"><path d="M372 582 1076 546 1112 606 396 622z" fill="url(#tr-rado)" stroke="none"/></g>

  <!-- la lettera -->
  <g color="#1C1C1C" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round">
    <path d="M360 262 1030 222 1076 546 372 582z" fill="#FFFFFF" fill-opacity=".7" stroke-width="1.6" opacity=".62"/>
    <path d="M360 262 712 434 1030 222" stroke-width="1.4" opacity=".55"/>
    <path d="M372 582 640 400M1076 546 790 396" stroke-width="1" opacity=".3"/>
    <path d="M384 276 700 428M1008 238 724 430" stroke-width=".7" opacity=".18"/>
  </g>
  <g color="#B88F3D" opacity=".3"><path d="M360 262 712 434 372 582z" fill="url(#tr-rado)" stroke="none"/></g>

  <!-- il sigillo con la rosa -->
  <g color="#8D6E2A">
    <circle cx="712" cy="434" r="54" fill="#B88F3D" fill-opacity=".14" stroke="currentColor" stroke-width="1.8" opacity=".85"/>
    <circle cx="712" cy="434" r="46" fill="none" stroke="currentColor" stroke-width=".8" opacity=".5"/>
    <use href="#rosa" x="676" y="398" width="72" height="72" opacity=".9"/>
  </g>
  <g color="#B88F3D" opacity=".5"><path d="M660 440a54 54 0 0 0 40 46" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" opacity=".35"/></g>

  <!-- la penna stilografica -->
  <g color="#1C1C1C" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1080 612 1318 372" stroke-width="12" opacity=".14"/>
    <path d="M1090 604 1300 392M1104 616 1314 404" stroke-width="1.5" opacity=".6"/>
    <path d="M1090 604 1104 616M1300 392 1314 404" stroke-width="1.5" opacity=".6"/>
    <path d="M1192 502 1206 514" stroke-width="1.2" opacity=".5"/>
    <path d="M1090 604 1060 632 1104 616z" stroke-width="1.4" opacity=".65"/>
    <path d="M1082 622 1066 630" stroke-width=".8" opacity=".5"/>
  </g>
  <g color="#8D6E2A" opacity=".8"><path d="M1090 604 1060 632" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="1066" cy="627" r="2.2" fill="currentColor" stroke="none"/></g>
  <g color="#1C1C1C" opacity=".28"><path d="M1084 622 1318 384 1326 396 1096 630z" fill="url(#tr-medio)" stroke="none"/></g>
</svg>
