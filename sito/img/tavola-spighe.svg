  <!-- stelo destro -->
  <g color="#1C1C1C"><path d="M448 744c-12-104-24-206-20-286" fill="none" stroke="currentColor" stroke-width="1.8"/></g>
  <g color="#8D6E2A" opacity=".85">
    <use href="#chicco" width="16" height="36" x="420" y="430" transform="rotate(4 428 448)"/>
    <use href="#chicco" width="16" height="36" x="404" y="460" transform="rotate(-12 412 478)"/>
    <use href="#chicco" width="16" height="36" x="434" y="460" transform="rotate(14 442 478)"/>
    <use href="#chicco" width="15" height="34" x="406" y="492" transform="rotate(-14 413 509)"/>
    <use href="#chicco" width="15" height="34" x="432" y="492" transform="rotate(16 439 509)"/>
    <use href="#chicco" width="14" height="32" x="410" y="524" transform="rotate(-16 417 540)"/>
    <use href="#chicco" width="14" height="32" x="430" y="524" transform="rotate(18 437 540)"/>
  </g>
  <g color="#8D6E2A" stroke="currentColor" fill="none" stroke-width=".8" opacity=".55" stroke-linecap="round">
    <path d="M426 426 416 344M410 460 378 396M440 460 472 396"/>
  </g>

  <!-- foglie -->
  <g color="#1C1C1C" opacity=".85"><use href="#foglia" width="52" height="140" x="238" y="586" transform="rotate(-24 264 656)"/></g>
  <g color="#1C1C1C" opacity=".85"><use href="#foglia" width="48" height="130" x="366" y="600" transform="rotate(22 390 665)"/></g>

  <!-- terra -->
  <g color="#1C1C1C" opacity=".5"><line x1="120" y1="744" x2="520" y2="744" stroke="currentColor" stroke-width="1"/></g>
  <g color="#1C1C1C"><rect x="120" y="744" width="400" height="16" fill="url(#tr-rado)" stroke="none"/></g>
</svg>