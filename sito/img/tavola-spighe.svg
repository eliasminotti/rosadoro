    <use href="#chicco" width="15" height="34" x="222" y="456" transform="rotate(12 229 473)"/>
    <use href="#chicco" width="14" height="32" x="196" y="488" transform="rotate(-18 203 504)"/>
    <use href="#chicco" width="14" height="32" x="220" y="488" transform="rotate(14 227 504)"/>
  </g>
  <g color="#8D6E2A" stroke="currentColor" fill="none" stroke-width=".8" opacity=".55" stroke-linecap="round">
    <path d="M216 392 202 306M198 424 164 356M228 424 262 356"/>
