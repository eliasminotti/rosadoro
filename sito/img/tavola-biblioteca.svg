    <stop offset="42%" stop-color="#B88F3D" stop-opacity=".10"/>
    <stop offset="100%" stop-color="#FAF6EE" stop-opacity="0"/>
  </radialGradient>
  <symbol id="petalo" viewBox="-20 -44 40 48" width="40" height="48" x="-20" y="-44" overflow="visible">
