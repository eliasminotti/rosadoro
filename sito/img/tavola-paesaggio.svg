<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-label="Paesaggio di colline coltivate, inciso">
<defs>
  <!-- tratteggi -->
  <pattern id="tr-fitto" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="currentColor" stroke-width="1.5" opacity=".55"/>
  </pattern>
  <pattern id="tr-medio" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
    <line x1="0" y1="0" x2="0" y2="10" stroke="currentColor" stroke-width="1.1" opacity=".45"/>
  </pattern>
  <pattern id="tr-rado" width="17" height="17" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
    <line x1="0" y1="0" x2="0" y2="17" stroke="currentColor" stroke-width=".9" opacity=".35"/>
  </pattern>
  <pattern id="tr-croce" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
    <line x1="0" y1="0" x2="0" y2="9" stroke="currentColor" stroke-width=".9" opacity=".4"/>
    <line x1="0" y1="0" x2="9" y2="0" stroke="currentColor" stroke-width=".9" opacity=".4"/>
  </pattern>

  <!-- chicco di grano -->
  <symbol id="chicco" viewBox="0 0 20 44" overflow="visible">
    <path d="M10 1c6 7 8 14 8 21s-3 14-8 21c-5-7-8-14-8-21S4 8 10 1z" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <path d="M10 6v32" stroke="currentColor" stroke-width=".9" opacity=".6"/>
  </symbol>

  <!-- foglia lanceolata -->
  <symbol id="foglia" viewBox="0 0 60 160" overflow="visible">
    <path d="M30 2C10 40 2 92 26 158 50 92 46 40 30 2z" fill="none" stroke="currentColor" stroke-width="1.6"/>
    <path d="M30 8c-2 44-4 96-4 148" stroke="currentColor" stroke-width="1" opacity=".7"/>
    <g stroke="currentColor" stroke-width=".8" opacity=".45">
      <path d="M29 34 16 46M29 34 42 44M28 60 14 74M28 60 43 70M27 88 15 102M27 88 42 98M26 116 17 128M26 116 39 126"/>
    </g>
  </symbol>

  <!-- petalo di rosa -->
  <symbol id="petalo" viewBox="0 0 100 100" overflow="visible">
    <path d="M50 96C16 84 4 56 12 32 20 8 44 0 50 0s30 8 38 32c8 24-4 52-38 64z" fill="none" stroke="currentColor" stroke-width="1.5"/>
  </symbol>
</defs>

  <rect width="1400" height="760" fill="#FBFBF9"/>

  <!-- cielo: sole a raggi sottili -->
  <g color="#B88F3D" opacity=".55">
    <circle cx="1074" cy="196" r="62" fill="none" stroke="currentColor" stroke-width="1.4"/>
    <g stroke="currentColor" stroke-width=".9" stroke-linecap="round" opacity=".7">
      <path d="M1074 108V70M1074 322v-38M1162 196h38M986 196h-38M1136 134l27-27M1012 258l-27 27M1136 258l27 27M1012 134l-27-27"/>
    </g>
  </g>

  <!-- colline lontane -->
  <g color="#1C1C1C" opacity=".4">
    <path d="M0 342c150-52 268-16 392 12 124 28 236 24 356-14 120-38 268-46 392-14 84 22 176 30 260 22v34H0z" fill="none" stroke="currentColor" stroke-width="1.2"/>
  </g>
  <g color="#1C1C1C" opacity=".14">
    <path d="M0 342c150-52 268-16 392 12 124 28 236 24 356-14 120-38 268-46 392-14 84 22 176 30 260 22v34H0z" fill="url(#tr-rado)" stroke="none"/>
  </g>

  <!-- collina media -->
  <g color="#8D6E2A" opacity=".7">
    <path d="M0 442c180-58 328-18 486 10 158 28 296 12 452-26 120-30 300-24 462 8v50H0z" fill="none" stroke="currentColor" stroke-width="1.4"/>
  </g>
  <g color="#8D6E2A" opacity=".16">
    <path d="M0 442c180-58 328-18 486 10 158 28 296 12 452-26 120-30 300-24 462 8v50H0z" fill="url(#tr-medio)" stroke="none"/>
  </g>

  <!-- albero -->
  <g color="#1C1C1C">
    <path d="M300 486v-56" fill="none" stroke="currentColor" stroke-width="2.4"/>
    <path d="M300 442c-10-10-16-22-14-34M300 448c10-8 18-18 20-30" fill="none" stroke="currentColor" stroke-width="1.4"/>
    <ellipse cx="300" cy="378" rx="56" ry="46" fill="none" stroke="currentColor" stroke-width="1.6"/>
    <g opacity=".3"><ellipse cx="300" cy="378" rx="56" ry="46" fill="url(#tr-croce)" stroke="none"/></g>
    <g stroke="currentColor" fill="none" stroke-width="1" opacity=".6">
      <path d="M258 358c14-12 32-16 48-10M270 402c18 8 42 6 58-6M320 348c14 4 24 14 26 26"/>
    </g>
  </g>

  <!-- campo in primo piano: solchi in prospettiva -->
  <g color="#8D6E2A" stroke="currentColor" fill="none" stroke-linecap="round">
    <g stroke-width="1.2" opacity=".62">
      <path d="M-60 760 606 470M100 760 640 470M260 760 674 470M420 760 708 470M580 760 742 470M740 760 776 470M900 760 810 470M1060 760 844 470M1220 760 878 470M1380 760 912 470M1540 760 946 470"/>
    </g>
    <g stroke-width=".9" opacity=".3">
      <path d="M20 760 623 470M180 760 657 470M340 760 691 470M500 760 725 470M660 760 759 470M820 760 793 470M980 760 827 470M1140 760 861 470M1300 760 895 470"/>
    </g>
    <!-- traverse -->
    <g stroke-width=".8" opacity=".26">
      <path d="M0 486h1400M0 520h1400M0 566h1400M0 626h1400M0 700h1400"/>
    </g>
  </g>

  <!-- spighe in primissimo piano, a destra -->
  <g color="#8D6E2A" opacity=".9">
    <path d="M1268 760c-6-84-8-152 4-198M1332 760c-4-72-6-132 6-172" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <use href="#chicco" width="15" height="34" x="1264" y="546" transform="rotate(-6 1271 563)"/>
    <use href="#chicco" width="14" height="32" x="1252" y="578" transform="rotate(-18 1259 594)"/>
    <use href="#chicco" width="14" height="32" x="1278" y="578" transform="rotate(12 1285 594)"/>
    <use href="#chicco" width="13" height="30" x="1256" y="610" transform="rotate(-20 1262 625)"/>
    <use href="#chicco" width="13" height="30" x="1276" y="610" transform="rotate(14 1282 625)"/>
    <use href="#chicco" width="14" height="32" x="1332" y="574" transform="rotate(4 1339 590)"/>
    <use href="#chicco" width="13" height="30" x="1320" y="604" transform="rotate(-16 1326 619)"/>
    <use href="#chicco" width="13" height="30" x="1344" y="604" transform="rotate(16 1350 619)"/>
  </g>
</svg>